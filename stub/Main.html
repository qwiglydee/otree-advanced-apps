{% extends "FullPage.html" %}
{% block content %}
    <header>
        <ot-progress ticks="1" max="vars.progress.total" value="vars.progress.passed" value2="vars.progress.current"></ot-progress>
        <div class="alert alert-secondary m-2">Total score: <span ot-text="vars.progress.score"></span></div>
    </header>

    <main ot-visible="vars.trial">
        <section class="paper fs-4 text-center">
            <p ot-text="vars.trial.task"></p>
        </section>

        <section class="form">
            <div class="grid-2">
                <button ot-click-input type="button" name="response" value="FOO" class="btn btn-primary">Foo</button>
                <button ot-click-input type="button" name="response" value="BAR" class="btn btn-primary">Bar</button>
            </div>
        </section>
    </main>

    <footer>
        <div ot-display="vars.result">Result: <b ot-text="vars.result.outcome"></b></div>
        <div ot-display="vars.result">Scored: <i ot-text="vars.result.score"></i></div>
        <div class="flex-fill"></div>
        <div ot-display="vars.prompting">Make your response...</div>
        <ot-pulse ot-display="vars.waiting" class="m-2"></ot-pulse>
    </footer>
{% endblock content %}

{% block scripts %}
    <script>
        "use strict";

        const BLINK_DELAY = 200;
        const ITER_DELAY = 1000 * "{{C.ITER_DELAY}}";

        function switchState(state) {
            // console.debug("switching", state);

            vars.waiting = false;
            vars.responding = false;
            vars.prompting = false;

            switch (state) {
                case "starting":
                case "processing":
                    vars.waiting = true;
                    break;
                case "completing":
                    vars.waiting = true;
                    break;
                case "running":
                    vars.responding = true;
                    vars.prompting = true;
                    break;
                default:
                    throw Error(`Bogus state switch: ${state}`);
            }
            ot.updatePage();
        }

        ot.onLoad(initPage);
        ot.onLive("progress", liveProgress);
        ot.onLive("trial", startTrial);
        ot.onInput("response", inputResponse);
        ot.onLive("feedback", liveFeedback);
        ot.onLive("result", liveResult);
        ot.onInput("continue", iterateRound);

        function initPage() {
            resetTrial();
            switchState("starting");
            ot.sendLive("load");
        }

        async function iterateRound() {
            resetTrial();
            switchState("starting");
            await ot.delay(BLINK_DELAY);
            ot.sendLive("iterate");
        }

        function liveProgress(progress) {
            vars.progress = progress;
            if (progress.terminated) ot.completePage();
        }

        function resetTrial() {
            vars.trial = null;
            vars.response = null;
            vars.feedback = null;
            vars.result = null;
            ot.resetInputs();
        }

        function startTrial(trial) {
            vars.trial = trial;
            switchState("running");
            ot.beginTimeMeasurement(); // NB: restarts on page reload
        }

        function inputResponse(value) {
            vars.response = value; // use Number(value) or String(value) if needed
            switchState("processing");
            ot.sendLive("response", {
                trialid: vars.trial.id,
                time: ot.getTimeMeasurement(),
                value: vars.response,
            });
        }

        function liveFeedback(feedback) {
            vars.feedback = feedback;
        }

        function liveResult(result) {
            vars.result = result;
            completeTrial();
        }

        async function completeTrial() {
            switchState("completing");
            await ot.delay(ITER_DELAY);
            iterateRound();
        }
    </script>
{% endblock scripts %}
