{% extends 'otree/WaitPage.html' %}

{% block global_styles %}
    <link rel="stylesheet" href="{{ static '_extras/bootstrap-theme.css' }}" />
    <link rel="stylesheet" href="{{ static '_extras/game-style.css' }}" />
{% endblock %}

{% block body_main %}
    <div class="otree-wait-page container">
        <h2 class="otree-title">{{ title_text }}</h2>

        <div class="alert alert-info text-center">
            <p>{{ body_text }}</p>
            <div class="progress">
                <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar"></div>
            </div>
        </div>

        <!-- TODO: insert inactivity alerts -->
    </div>
{% endblock %}
