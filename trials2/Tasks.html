{% extends "FullPage.html" %}
{% block content %}
    <header>
        <ot-progress ticks="1" max="vars.progress.total" value="vars.progress.passed" value2="vars.progress.current.iteration"></ot-progress>
        <div class="alert alert-secondary m-2">Total score: <b ot-text="vars.progress.score"></b></div>
    </header>

    <main ot-visible="vars.trial">
        <section class="paper fs-4">
            <p ot-text="vars.trial.task"></p>
        </section>

        {% if player.role == "P2" %}
            <section class="info" ot-visible="vars.trial.answers.P1">Your partner's answer: <b ot-text="vars.trial.answers.P1"></b></section>
        {% endif %}

        <section class="form">
            <input
                ot-input
                type="number"
                name="answer"
                class="form-control"
                ot-key-input="Enter"
                autofocus
                ot-class="vars.validity"
                ot-enable="vars.responding"
            />
        </section>

        {% if player.role == "P1" %}
            <section class="info" ot-visible="vars.trial.answers.P2">Your partner's answer: <b ot-text="vars.trial.answers.P2"></b></section>
        {% endif %}
    </main>

    <footer>
        <div ot-display="vars.feedback.truth">Correct solution: <span ot-text="vars.feedback.truth"></span></div>
        <div ot-display="vars.result">Score: <b ot-text="vars.result.score"></b></div>
        <div class="flex-fill"></div>
        <button ot-display="vars.completing" ot-click-input type="button" name="continue" class="btn btn-secondary m-3" autofocus>Continue</button>
        <ot-pulse ot-display="vars.waiting"></ot-pulse>
        <div ot-display="vars.pending">Waiting for your partner</div>
    </footer>
{% endblock content %}

{% block scripts %}
    <script>
        "use strict";

        const MYSTAGE = "{{MYSTAGE}}";
        const BLINK_DELAY = 200;
        const TRIAL_DELAY = 1000 * "{{C.TRIAL_DELAY}}";

        onLoad(continueRound);
        onLive("progress", liveProgress);
        onLive("trial", loadTrial);
        onLive("update", updateTrial);
        onInput("answer", inputAnswer);
        onLive("feedback", liveFeedback);
        onInput("continue", continueRound);
        onUpdate("vars.feedback.score", showResult);
        onUpdate("vars.feedback.correct", showValidity);

        function switchPhase(phase) {
            // console.debug("phase =", phase);
            vars.responding = phase == "responding";
            vars.completing = phase == "completing";
            vars.waiting = phase == "waiting" || phase == "pending";
            vars.pending = phase == "pending";
            ot.updatePage();
        }

        async function continueRound() {
            switchPhase("waiting");
            resetTrial();
            await ot.delay(BLINK_DELAY);
            sendLive("continue");
        }

        async function liveProgress(progress) {
            vars.progress = progress;
            if (progress.finished) {
                ot.completePage();
            } else if (progress.pending) {
                switchPhase("pending");
            } else if (progress.current) {
                if (progress.current.completed) {
                    //switchPhase("waiting");
                    //await ot.delay(TRIAL_DELAY);
                    //continueRound()
                    switchPhase("completing");
                } else if (progress.current.running) {
                    switchPhase(progress.current.stage == MYSTAGE ? "responding" : "pending");
                }
            }
        }

        function resetTrial() {
            vars.trial = null;
            vars.answer = null;
            vars.feedback = null;
            ot.resetInputs();
        }

        function loadTrial(trial) {
            vars.trial = trial;
            ot.beginTimeMeasurement();
        }

        function updateTrial(update) {
            Object.assign(vars.trial, update);
        }

        function inputAnswer(answer) {
            vars.answer = answer;
            vars.responding = false;
            sendLive("response", {
                id: vars.trial.id,
                time: ot.getTimeMeasurement(),
                answer: String(answer),
            });
        }

        async function liveFeedback(feedback) {
            vars.feedback = feedback;
        }

        function showResult(score) {
            if (score != null) {
                vars.result = { score }; // TODO: format
            } else {
                vars.result = null;
            }
            ot.updatePage();
        }

        function showValidity(correct) {
            if (correct != null) {
                vars.validity = correct ? "is-valid" : "is-invalid";
            } else {
                vars.validity = null;
            }
            ot.updatePage();
        }
    </script>
{% endblock %}
